name: Verkeersdata NDW

on:
  # elk uur verse files, ongevallen en afsluitingen (op minuut 7); handmatig kan ook via Actions
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: NDW-data ophalen en omzetten
        run: python3 ndw.py

      - name: Opslaan als er iets veranderd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verkeer.json data/ndw-diagnose.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Verkeersdata bijgewerkt"
            git pull --rebase origin main
            git push
          fi
