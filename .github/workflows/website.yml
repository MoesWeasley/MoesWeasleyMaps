name: Website (GitHub Pages)

# Zet de app online op https://moesweasley.github.io/MoesWeasleyMaps/ bij elke wijziging aan de app.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'ndw.py'
      - 'flitsers.py'
      - '.github/workflows/ndw-data.yml'
      - '.github/workflows/flitsers.yml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kaartbibliotheek ophalen
        run: npm install --no-save --ignore-scripts maplibre-gl@4.7.1 mapbox-gl@3
      - name: Bestanden klaarzetten
        run: node prepare.js && touch www/.nojekyll
      - name: Hulpdienstdetector bouwen (programma voor het bordje)
        continue-on-error: true
        run: |
          pip install --quiet platformio esptool
          pio run -d detector
          B=detector/.pio/build/heltec_v3
          mkdir -p www/flash
          python -m esptool --chip esp32s3 merge_bin -o www/flash/moesdetector.bin --flash_mode dio --flash_size 8MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
          cp detector/flash/index.html detector/flash/manifest.json www/flash/
      - name: Detector-programma klaarzetten om te downloaden
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: moesdetector-firmware
          path: www/flash/moesdetector.bin
      - name: Naar gh-pages zetten
        run: |
          cd www
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website bijgewerkt"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
