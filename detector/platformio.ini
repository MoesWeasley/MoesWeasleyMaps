; MoesDetector – hulpdienstdetector voor de Heltec WiFi LoRa 32 V3 (433 MHz-versie)
; Bouwen: pio run   ·   Op het bordje zetten: pio run -t upload
; (of via de installeerpagina op de website, zonder iets te installeren)

[env:heltec_v3]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  jgromes/RadioLib@6.6.0
  h2zero/NimBLE-Arduino@1.4.2
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.1
